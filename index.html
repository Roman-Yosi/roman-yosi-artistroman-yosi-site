<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Roman Yosi - Official Music Artist</title>
  <meta name="description" content="Roman Yosi is an independent music artist from Indonesia. Official profile, music, and social links." />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:title" content="Roman Yosi - Official Music Artist" />
  <meta property="og:description" content="Official music artist page of Roman Yosi." />
  <meta property="og:type" content="profile" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      text-align: center;
      padding: 50px 20px;
      background: linear-gradient(135deg, #111, #000);
    }

    .profile-img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #1db954;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 36px;
    }

    .subtitle {
      opacity: 0.8;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .section {
      margin: 30px 0;
      padding: 20px;
      background: #161616;
      border-radius: 12px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .gallery img {
      width: 100%;
      border-radius: 10px;
    }

    a {
      color: #1db954;
      text-decoration: none;
    }

    .btn {
      display: inline-block;
      margin: 5px;
      padding: 10px 15px;
      background: #1db954;
      color: black;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>

  <!-- Structured Data (IMPORTANT FOR KNOWLEDGE PANEL) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MusicGroup",
    "name": "Roman Yosi",
    "image": "https://raw.githubusercontent.com/Roman-Yosi/Poto-roman-yosi/refs/heads/main/final-image.jpg",
    "sameAs": [
      "https://open.spotify.com/artist/3j2wzsjuf9JcBgRZxP44dJ",
      "https://youtube.com/@romanyosimusic",
      "https://www.tiktok.com/@romanyosi"
    ]
  }
  </script>

</head>
<body>

<header>
  <img src="https://raw.githubusercontent.com/Roman-Yosi/Poto-roman-yosi/refs/heads/main/final-image.jpg" class="profile-img" alt="Roman Yosi" />
  <h1>Roman Yosi</h1>
  <div class="subtitle">Official Music Artist & Digital Creator</div>
</header>

<div class="container">

  <div class="section">
    <h2>About</h2>
    <p>Roman Yosi is an independent music artist from Indonesia focused on emotional storytelling, modern sound, and digital music content.</p>
  </div>

  <div class="section">
    <h2>Music Platforms</h2>
    <a class="btn" href="https://open.spotify.com/artist/3j2wzsjuf9JcBgRZxP44dJ">Spotify</a>
    <a class="btn" href="https://youtube.com/@romanyosimusic">YouTube</a>
    <a class="btn" href="https://www.tiktok.com/@romanyosi">TikTok</a>
  </div>

  <div class="section">
    <h2>Gallery</h2>
    <div class="gallery">
      <img src="photo1.jpg" alt="Roman Yosi 1" />
      <img src="photo2.jpg" alt="Roman Yosi 2" />
      <img src="photo3.jpg" alt="Roman Yosi 3" />
    </div>
  </div>

  <div class="section">
    <h2>Press / Contact</h2>
    <p>Email: your-email@example.com</p>
  </div>

</div>

</body>
</html>
